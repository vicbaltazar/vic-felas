<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vic@felas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="win">
        <div class="bar">
            <span>vic@felas: ~</span>
            <span>zsh</span>
        </div>

        <div class="body">
            <div class="neofetch">
                <pre class="ascii"> /\_/\
( o.o )
 > ^ &lt;
/|   |\
(_|   |_)</pre>


                <div class="info">
                    <div class="info-head">vic@felas</div>
                    <div class="info-rule">-----------------</div>
                    <div class="info-row"><span class="info-key">OS</span><span class="info-value">: Vitória Baltazar</span></div>
                    <div class="info-row"><span class="info-key">Cargo</span><span class="info-value">: Dev Full Stack</span></div>
                    <div class="info-row"><span class="info-key">Local</span><span class="info-value">: Sertãozinho, SP</span></div>
                    <div class="info-row"><span class="info-key">Shell</span><span class="info-value">: Energético + zsh</span></div>
                </div>
            </div>

            <hr class="divider">

            <div class="section-label">$ ls ~/links</div>
            <div class="links" id="links"></div>

            <div class="swatches">
                    <div class="swatch" style="background:#F49DAB;"></div>
                    <div class="swatch" style="background:#FFDCDC;"></div>
                    <div class="swatch" style="background:#8DE5B8;"></div>
                    <div class="swatch" style="background:#9EC96F;"></div>
                    <div class="swatch" style="background:#FFFBF8;"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
